<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Build logo</title>
  <desc id="desc">A dark Microsoft Build wordmark with colorful segmented letters.</desc>
  <rect width="1120" height="360" fill="#000000"/>
  <defs>
    <linearGradient id="buildGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35a8e0"/>
      <stop offset="0.16" stop-color="#2f6ed3"/>
      <stop offset="0.31" stop-color="#f72518"/>
      <stop offset="0.48" stop-color="#f6c02d"/>
      <stop offset="0.66" stop-color="#6fbf2d"/>
      <stop offset="0.82" stop-color="#35a8e0"/>
      <stop offset="1" stop-color="#f72518"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g fill="none" stroke="url(#buildGradient)" stroke-width="22" stroke-linejoin="miter" stroke-linecap="square" filter="url(#softGlow)">
    <path d="M90 58 H246 V138 H168 V176 H246 V258 H90 Z"/>
    <path d="M326 58 V244 H454 V58"/>
    <path d="M536 58 V258"/>
    <path d="M626 58 V258 H782"/>
    <path d="M866 58 H1000 Q1052 58 1052 158 Q1052 258 1000 258 H866 Z"/>
  </g>
  <g fill="#000000">
    <rect x="168" y="138" width="78" height="38"/>
    <rect x="168" y="176" width="78" height="38"/>
  </g>
  <g fill="#ffffff" opacity="0.24">
    <rect x="322" y="18" width="4" height="24"/>
    <rect x="336" y="18" width="4" height="24"/>
    <rect x="350" y="18" width="4" height="24"/>
    <rect x="1104" y="16" width="4" height="14"/>
    <rect x="1118" y="16" width="4" height="14"/>
  </g>
</svg>